# ==============================================================================
# Job Scout: Candidate Search Profile (Example Template)
# Copy this file to 'profile.yaml' and customize with your own targets.
# ==============================================================================

# Target Job Roles (Roles you are hunting for)
target_roles:
  - "Software Engineer"
  - "Backend Engineer"
  - "Full Stack Developer"
  - "AI Engineer"

# Core Skills & Tech Stack (Matches will boost ranking score)
skills:
  - "Python"
  - "FastAPI"
  - "Docker"
  - "PostgreSQL"
  - "REST API"

# Contract / Seniority Types to Boost (Optional, e.g. "Junior", "Working Student", "Intern")
contract_types:
  - "Junior"
  - "Associate"

# Desired Locations & Work Styles
locations:
  - "Remote"
  - "Europe"
  - "Germany"
  - "United States"

# Exclusion Keywords (Immediate disqualification filter across title & description)
negative_keywords:
  - "staff"
  - "principal"
  - "director"
  - "head of"
  - "vp"
  - "8+ years"
  - "10+ years"
  - "sales"
  - "marketing"
  - "recruiting"
  - "hr"

# Title-Only Exclusion Keywords (Disqualifies ONLY if found in the job title)
# Great for seniority or role titles you want to avoid without excluding descriptions that merely mention them.
negative_title_keywords:
  - "senior"
  - "sr."
  - "lead"
  - "manager"
  - "architect"
  - "design"
  - "designer"

# ATS Platforms to Hunt On
# Supported: greenhouse, lever, ashby, personio, workday, smartrecruiters
ats_platforms:
  - "greenhouse"
  - "lever"
  - "ashby"
  - "personio"
  - "workday"

# Direct Job APIs to Include (e.g. Arbeitnow, Jobicy)
include_api_feeds: true

# Optional: Add any manual Google / DuckDuckGo search dorks directly
custom_queries: []
